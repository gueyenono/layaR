[package]
name = 'laya_r'
publish = false
version = '0.1.0'
edition = '2024'
rust-version = '1.85'

[lib]
crate-type = [ 'rlib', 'staticlib' ]
name = 'laya_r'

[[bin]]
name = 'document'
path = 'document.rs'

[dependencies]
extendr-api = '0.9.0'
# laya-onnx is not on crates.io yet. Pinned to the merge commit of laya PR #1508
# (NandhaKishorM/laya#1505), which ships with laya 0.5.1; move to the tag once it exists.
# `download` is off: models are downloaded from R (plan D7). `load-dynamic`: no ONNX Runtime
# download or link at build time; R loads the library at runtime (R/runtime.R).
laya-onnx = { git = 'https://github.com/NandhaKishorM/laya', rev = '1bf3003bf8a105b1a0aae585958ac7022bc3deb5', default-features = false, features = ['load-dynamic'] }
# Match laya-onnx's own Cargo.lock (ort 2.0.0-rc.13); a caret req would pick a newer rc.
# Default features off, or feature unification turns ort's download-binaries back on.
# rc.13 with api-27 needs ONNX Runtime >= 1.27; keep in sync with `ort_version` in R/runtime.R.
ort = { version = '=2.0.0-rc.13', default-features = false, features = ['load-dynamic'] }
# Verifies the ONNX Runtime download.
sha2 = '0.10'
# Reads the loaded ONNX Runtime's version (the same crate and version `ort` loads it with).
libloading = '0.9'
serde_json = { version = '1', features = ['preserve_order', 'float_roundtrip'] }
indexmap = '2'
log = '0.4'

[profile.release]
lto = true
codegen-units = 1
