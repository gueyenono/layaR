[package]
name = 'laya_r'
publish = false
version = '0.1.0'
edition = '2024'
rust-version = '1.92'

[lib]
crate-type = [ 'rlib', 'staticlib' ]
name = 'laya_r'

[[bin]]
name = 'document'
path = 'document.rs'

[dependencies]
extendr-api = '0.9.0'
# laya-onnx is not on crates.io yet. TEST BRANCH: pinned to chetanxrathore's fix/rust-ort-rc15
# commit for NandhaKishorM/laya#1527 (ort rc.15, `LayaOptions::environment`).
# `download` is off: models are downloaded from R (plan D7). `load-dynamic`: no ONNX Runtime
# download or link at build time; R loads the library at runtime (R/runtime.R).
laya-onnx = { git = 'https://github.com/chetanxrathore/laya', rev = '1786354d59a93e0ab3ff0b26647373b55d62eb38', default-features = false, features = ['load-dynamic'] }
# Match laya-onnx's own pin (ort 2.0.0-rc.15); a caret req would pick a newer rc.
# Default features off, or feature unification turns ort's download-binaries back on.
# rc.15 with api-27 needs ONNX Runtime >= 1.27; keep in sync with `ort_version` in R/runtime.R.
ort = { version = '=2.0.0-rc.15', default-features = false, features = ['load-dynamic'] }
# Verifies the ONNX Runtime download.
sha2 = '0.10'
# Reads the loaded ONNX Runtime's version (the same crate and version `ort` loads it with).
libloading = '0.9'
serde_json = { version = '1', features = ['preserve_order', 'float_roundtrip'] }
indexmap = '2'
log = '0.4'

[profile.release]
lto = true
codegen-units = 1
